<style>
:root{
  --bg:#f2f2f7;--card:#fff;--ink:#1c1c2e;--ink2:#6b6b80;--line:rgba(60,60,100,.13);--fill:#f2f2f7;
  --accent:#6a4cff;--accent-soft:#eeeaff;--onaccent:#fff;
  --pos:#14a56c;--posbg:#e2f7ec;--neg:#f0365a;--negbg:#ffe9ee;--warn:#9a5b00;--warnbg:#fff2d9;
  --shadow:0 1px 2px rgba(20,20,60,.05),0 8px 28px rgba(40,30,100,.07);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --tabh:62px;--r:20px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c24;--ink:#f2f2f7;--ink2:#9d9db4;--line:rgba(255,255,255,.12);--fill:#2a2a35;
  --accent:#9a86ff;--accent-soft:rgba(154,134,255,.18);--onaccent:#10101a;
  --pos:#4fdc9f;--posbg:rgba(79,220,159,.14);--neg:#ff6b88;--negbg:rgba(255,107,136,.16);--warn:#ffc15e;--warnbg:rgba(255,193,94,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.4 var(--font);color:var(--ink);background:var(--bg);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
h1.ttl{font-size:2.1rem;line-height:1.1;margin:6px 0 14px}
h2{font-size:1.25rem}h3{font-size:1.05rem}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}.small{font-size:.86rem}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}

#app{max-width:1000px;margin:0 auto;padding:0 0 calc(var(--tabh) + env(safe-area-inset-bottom) + 28px)}
.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 6px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1rem;color:var(--ink2);margin-right:auto;letter-spacing:-.01em}
.file{order:3;flex-basis:100%;display:flex;align-items:center;gap:8px;min-width:0;font-size:.82rem;color:var(--ink2)}
.file b{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:600}
.badge{border:0;border-radius:99px;padding:3px 11px;font-size:.78rem;font-weight:600;background:var(--accent-soft);color:var(--accent)!important;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pos);display:inline-block;flex:none}
.dot.dirty{background:#ffa21f}
.btn{border:0;background:var(--accent);color:var(--onaccent);border-radius:14px;padding:0 20px;min-height:48px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--negbg);color:var(--neg)}
.btn.sm{min-height:34px;padding:0 14px;font-size:.88rem;border-radius:99px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.attn{box-shadow:0 0 0 4px color-mix(in srgb,#ffa21f 40%,transparent)}
.btn:active{transform:scale(.98)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:1px solid var(--line);padding:4px 6px calc(env(safe-area-inset-bottom) + 2px)}
nav.tabs button{flex:1;border:0;background:none;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:500;color:var(--ink2);cursor:pointer;border-radius:12px}
nav.tabs button svg{width:25px;height:25px}
nav.tabs button[aria-current=page]{color:var(--accent)}
nav.tabs button[aria-current=page] svg{stroke-width:2.3}
main{padding:2px 16px 0}
@media (min-width:760px){
  #app{padding-bottom:48px}
  nav.tabs{position:static;display:inline-flex;margin:4px 16px 14px;padding:3px;gap:2px;border:0;border-radius:12px;background:rgba(120,120,140,.14);-webkit-backdrop-filter:none;backdrop-filter:none}
  nav.tabs button{flex:none;flex-direction:row;height:34px;padding:0 20px;font-size:.92rem;gap:8px;border-radius:9px}
  nav.tabs button svg{width:18px;height:18px}
  nav.tabs button[aria-current=page]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
  .top{padding:16px 16px 4px}.file{order:0;flex-basis:auto}.top .btn{order:0}
  main{padding:2px 16px 0}
  #toast{bottom:28px!important}
}
.dsk{display:none}@media (min-width:760px){.dsk{display:inline}}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin:0 0 14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 4px 10px;flex-wrap:wrap}
.hero{display:flex;flex-wrap:wrap;gap:8px 34px;align-items:flex-end}
.hero .yr{font-size:.82rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 11px;align-self:flex-start;width:100%;max-width:max-content}
.hero .k{font-size:.82rem;color:var(--ink2)}
.hero .v{font-size:2rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.hero .v.alt{font-size:1.5rem;color:var(--ink)}

.msg{border-radius:16px;padding:13px 16px;margin:0 0 14px;font-size:.93rem}
.msg.block{background:var(--negbg)}
.msg.warn{background:var(--warnbg)}
.msg.ok{background:var(--posbg);color:var(--pos);font-weight:500}
.msg ul{margin:6px 0 4px;padding-left:18px}
.msg b.t{display:block;margin-bottom:3px}
.tag{display:inline-block;font-size:.72rem;border-radius:99px;padding:1px 8px;margin-left:5px;background:rgba(120,120,140,.18)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;cursor:pointer}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:none;border-radius:99px;min-height:34px;padding:0 13px 0 10px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:.88rem;color:var(--ink2);text-decoration:line-through}
.chip i{width:11px;height:11px;border-radius:50%;background:var(--c);opacity:.45}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;scrollbar-width:thin}
.slide{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.slide-l{font-weight:600;font-size:.9rem;margin-bottom:6px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:10px}
.dot{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}
.dot.on{background:var(--accent)}
.chip small{font-size:.7rem;opacity:.8}
.chip.on{border-color:transparent;background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--ink);font-weight:500;text-decoration:none}
.chip.on i{opacity:1}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);margin:0 0 14px}
table.mx{border-collapse:separate;border-spacing:0;font-size:.85rem;min-width:100%}
table.mx th,table.mx td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.mx th{font-weight:600;font-size:.74rem;color:var(--ink2);white-space:normal;min-width:76px;vertical-align:bottom;line-height:1.2;background:var(--card)}
table.mx th i{display:block;width:100%;height:4px;border-radius:2px;background:var(--c);margin-bottom:6px}
table.mx th:first-child,table.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:88px}
table.mx td.z{color:var(--line)}
table.mx tr.cur td{background:color-mix(in srgb,var(--accent) 9%,var(--card));font-weight:600}
table.mx tr.fut td{opacity:.4}
table.mx tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
table.mx tr.avg td{color:var(--ink2);font-style:italic;border-bottom:0}
table.mx td.t,table.mx th.t{border-left:1px solid var(--line);font-weight:700}

.dn{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center}
@media (max-width:620px){.dn{grid-template-columns:1fr}.donut{max-width:210px;margin:0 auto}}
.donut{width:100%;height:auto;display:block}
.dn-v{font:700 21px var(--font);fill:var(--ink)}.dn-k{font:13px var(--font);fill:var(--ink2)}
.leg{display:grid;gap:2px}
.leg div{display:grid;grid-template-columns:14px 1fr auto 84px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.leg div:last-child{border:0}
.leg.w2 div{grid-template-columns:14px 1fr 96px}
.leg.w div{grid-template-columns:14px 1fr auto 84px 84px}
.leg i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.leg .p{color:var(--ink2);font-size:.82rem;font-weight:600}
.leg .a{text-align:right;font-weight:600}
svg.col{width:100%;height:auto;display:block}
svg.col text{fill:var(--ink2);font:17px var(--font)}

.refund{border-radius:var(--r);background:var(--accent-soft);padding:14px 18px;margin:0 0 14px;display:grid;gap:2px}
.refund span{font-size:.8rem;font-weight:600;color:var(--accent)}
.refund b{font-weight:600}
.refund strong{font-size:1.7rem;letter-spacing:-.03em;line-height:1.2}

.just{display:grid}
.just button{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:none;border:0;border-top:1px solid color-mix(in srgb,var(--neg) 25%,transparent);padding:10px 0;cursor:pointer;width:100%}
.just button:first-child{border-top:0}

/* form */
.form{display:grid;gap:14px;max-width:560px}
.card .form{max-width:none}
.f label.l,.f .l{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px;color:var(--ink2)}
.f input[type=text],.f input[type=date],.f input[type=number],.f select,.in{width:100%;min-height:50px;font-size:17px;border:0;border-radius:14px;padding:0 14px;background:var(--fill);appearance:none;-webkit-appearance:none}
.f select,select.in{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.f input:focus,.f select:focus,.in:focus{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;border-radius:12px;padding:3px;background:rgba(120,120,140,.16);gap:2px}
.seg label{flex:1;margin:0!important}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:42px;cursor:pointer;font-weight:600;font-size:.95rem;color:var(--ink2);border-radius:9px;padding:0 8px;text-align:center;transition:background .15s}
.seg input:checked+span{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.16)}
.seg input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.amount{font-weight:700!important;font-size:1.5rem!important;text-align:right;letter-spacing:-.02em}

/* elenco */
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:760px){.filters{grid-template-columns:repeat(5,1fr) auto;align-items:end}}
.filters label{font-size:.74rem;font-weight:600;color:var(--ink2);display:block;margin-bottom:4px}
.filters .in{min-height:44px;background:var(--card);box-shadow:var(--shadow)}
.led{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.lr{display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;cursor:pointer;align-items:center;position:relative}
.lr:last-child{border-bottom:0}
.lr:active{background:var(--fill)}
.lr .d{color:var(--ink2);font-size:.8rem;grid-row:span 2;text-align:center;line-height:1.2}
.lr .c{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.lr .c i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.lr .s{font-size:.84rem;color:var(--ink2);grid-column:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .a{grid-row:span 2;text-align:right;font-weight:600}
.lr.flag::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--neg)}
.pg{font-size:.7rem;font-weight:500;color:var(--ink2);background:rgba(120,120,140,.16);border-radius:99px;padding:1px 8px;white-space:nowrap}
.lr .p{display:none}
@media (min-width:760px){
  .lr{grid-template-columns:60px 210px 1fr 110px 110px;padding:11px 18px}
  .lr .d,.lr .a{grid-row:auto}.lr .s{grid-column:auto;font-size:.9rem}
  .lr .p{display:block;font-size:.88rem;color:var(--ink2)}.pg{display:none}
}
.sum{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin:2px 4px 12px}
.empty{padding:30px 16px;text-align:center;color:var(--ink2)}

/* impostazioni */
table.kv{border-collapse:collapse;width:100%;font-size:.93rem}
table.kv th,table.kv td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right}
table.kv th:first-child,table.kv td:first-child{text-align:left;font-weight:500}
table.kv thead th{font-size:.95rem;font-weight:700}
table.kv tr:last-child td{border-bottom:0}
table.kv tr.in-row td input{width:100%;max-width:130px;min-height:38px;text-align:right;border:0;border-radius:10px;padding:0 10px;background:var(--fill);font-size:16px}
table.kv tr.in-row td{white-space:nowrap}
table.kv tr.sub td{font-weight:700}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.cat-row{display:grid;grid-template-columns:34px 1fr auto;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.cat-row:last-child{border-bottom:0}
.cat-row .in{min-height:42px;font-size:16px}
.cat-opts{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;grid-column:1/-1;font-size:.88rem;color:var(--ink2)}
.cat-opts label{display:flex;gap:7px;align-items:center}
.cat-opts input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.cat-opts select{min-height:34px;border:0;border-radius:10px;background:var(--fill);padding:0 10px;font-size:15px}
input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:50%;overflow:hidden;cursor:pointer;-webkit-appearance:none;appearance:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
.pill-btn{border:0;background:var(--fill);border-radius:99px;min-height:34px;padding:0 14px;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--accent)}
.pill-btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{border:0;background:var(--accent-soft);color:var(--accent);width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn svg{width:17px;height:17px}
.help{display:grid;gap:8px;font-size:.88rem;color:var(--ink2);margin:0}
.help b{color:var(--ink)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,10,30,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheetm{background:var(--card);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:760px){.scrim{align-items:center}.sheetm{border-radius:24px}}
.acts{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.acts .grow{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);background:rgba(28,28,46,.94);color:#fff;padding:11px 18px;border-radius:99px;z-index:60;font-size:.9rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#busy{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(10,10,30,.38);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);cursor:progress}
#busy.on{display:flex}
.busy-box{display:flex;align-items:center;gap:14px;background:var(--card);color:var(--ink);padding:16px 22px;border-radius:18px;font-weight:600;box-shadow:0 10px 40px rgba(0,0,0,.25);max-width:88vw}
.spin{width:22px;height:22px;flex:none;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:gsspin .8s linear infinite}
@keyframes gsspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s!important}}

.land{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 64px) 24px 40px}
.land h1{font-size:2.6rem;line-height:1.05;margin-bottom:10px}
.land p{margin:0 0 20px;color:var(--ink2)}
.land .acts .btn{min-height:54px;font-size:1.02rem}
@media (max-width:759px){
  table.kv{font-size:.88rem}
  .tw table.kv{table-layout:fixed;width:100%}
  .tw table.kv th:first-child,.tw table.kv td:first-child{width:31%;white-space:normal}
  .tw table.kv tr.in-row td input{max-width:none;padding:0 6px}
  .tw table.kv input[type=date]{font-size:12px!important;padding:0 2px!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media (min-width:760px){.mob{display:none}}

</style>
</head>

<script>/* core.js — lettura/scrittura xlsx, modello dati e calcoli.
   Funziona sia nel browser (JSZip globale + DOMParser) sia in node (per generare il file iniziale). */
(function (root) {
'use strict';

const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MESI_LUNGHI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

/* ------------------------------------------------------------------ date */
const pad = n => String(n).padStart(2, '0');
function isoToSerial(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000);
}
function serialToIso(s) {
  const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(s) * 86400000);
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
}
function todayIso(now) { now = now || new Date(); return now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()); }
function parseDateAny(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v > 20000 ? serialToIso(v) : null;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return y + '-' + pad(+m[2]) + '-' + pad(+m[1]); }
  return null;
}
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; }
function parseNum(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim().replace(/[€\s]/g, '');
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
const round2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const norm = s => (s == null ? '' : String(s)).trim().toLowerCase().replace(/\s+/g, ' ');

/* ------------------------------------------------------- scrittura xlsx */
function colName(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
}
const BUILTIN_FMT = { 'General': 0, '0': 1, '0.00': 2, '#,##0': 3, '#,##0.00': 4, '0%': 9, '0.00%': 10 };

class Styles {
  constructor() {
    this.fonts = []; this.fills = ['none', 'gray125']; this.borders = ['']; this.fmts = []; this.xfs = []; this.map = new Map();
    this.font({}); this.get({});
  }
  font(o) {
    const k = JSON.stringify([o.b, o.i, o.sz, o.color]);
    let i = this.fonts.findIndex(f => f.k === k);
    if (i < 0) { this.fonts.push({ k, o }); i = this.fonts.length - 1; }
    return i;
  }
  fill(c) { if (!c) return 0; let i = this.fills.indexOf(c); if (i < 0) { this.fills.push(c); i = this.fills.length - 1; } return i; }
  border(b) { if (!b) return 0; let i = this.borders.indexOf(b); if (i < 0) { this.borders.push(b); i = this.borders.length - 1; } return i; }
  fmt(code) {

const sl = (lab, inner) => '<div class="slide"><div class="slide-l">' + lab + '</div>' + inner + '</div>';
const dots = labs => labs.length < 2 ? '' : '<div class="dots">' + labs.map((l, i) => '<button class="dot ' + (i ? '' : 'on') + '" data-act="slide" data-n="' + i + '" aria-label="' + h(l) + '"></button>').join('') + '</div>';
function donut(items, total) {
  const r = 62, cir = 2 * Math.PI * r; let off = 0;
  let s = '<svg viewBox="0 0 160 160" class="donut" role="img" aria-label="Ripartizione della media mensile per categoria"><g transform="rotate(-90 80 80)">';

    off += len;
  });
  return s + '</g><text x="80" y="78" text-anchor="middle" class="dn-v">' + Math.round(total).toLocaleString('it-IT') + ' €</text><text x="80" y="96" text-anchor="middle" class="dn-k">al mese</text></svg>';
}
const isViaggi = c => norm(c) === 'viaggi';
function senzaViaggi(R) {
  const keep = R.cols.map(c => !isViaggi(c)), pick = vals => vals.filter((_, i) => keep[i]), sum = a => a.reduce((x, y) => x + y, 0);
  const rows = R.rows.map(r => { const vals = pick(r.vals); return Object.assign({}, r, { vals, tot: sum(vals) }); });
  const mv = pick(R.media.vals);

function stackChart(R, curM) {

  const tots = R.rows.slice(1, 13).map(r => r.tot), avg = R.media.tot, mx = Math.max(...tots, avg, 1) * 1.08;
  const bw = (W - pl) / 12, y = v => pt + (H - pt - pb) * (1 - v / mx);
  let s = '<svg class="col" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Spese per mese per categoria, con linea della media">';
  for (let i = 0; i < 12; i++) {
    const x = pl + i * bw + bw * 0.18, w = bw * 0.64, done = i < R.media.n; let acc = 0;
    R.cols.forEach((c, k) => {
      const v = R.rows[i + 1].vals[k]; if (v <= 0.005) return;
      const y0 = y(acc + v), hh = y(acc) - y0; acc += v;
      s += '<rect x="' + x.toFixed(1) + '" y="' + y0.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(0.5, hh).toFixed(1) + '" fill="' + catColor(c) + '" opacity="' + (done ? 1 : 0.5) + '"><title>' + MESI_LUNGHI[i] + ' · ' + h(c) + ': ' + eur(v) + '</title></rect>';
    });
    s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle"' + (curM === i + 1 ? ' style="font-weight:700;fill:var(--ink)"' : '') + '>' + MESI[i] + '</text>';
  }
  return s + '<line x1="0" x2="' + W + '" y1="' + y(avg).toFixed(1) + '" y2="' + y(avg).toFixed(1) + '" stroke="var(--neg)" stroke-width="1.8" stroke-dasharray="6 4"/>'
    + '<text x="' + (W - 2) + '" y="' + (y(avg) - 6).toFixed(1) + '" text-anchor="end" style="fill:var(--neg);font-weight:700">media ' + Math.round(avg).toLocaleString('it-IT') + '</text></svg>';
}
function equilibrio() {
  const P = C.riparto(S), rows = P.righe; if (!rows.length) return '';
  const sgn = v => [(v > 0.005 ? '+' : '') + eur(v), v > 0.005 ? 'pos' : v < -0.005 ? 'neg' : ''];
  const row = (label, fn, cls) => '<tr class="' + (cls || '') + '"><td>' + label + '</td>' + rows.map(r => '<td class="num ' + (fn(r)[1] || '') + '">' + fn(r)[0] + '</td>').join('') + '</tr>';
  let msg = '';
  if (rows.length === 2) {
    const d = rows.find(r => r.totale < -0.005), cr = rows.find(r => r !== d);
    if (d) msg = '<div class="refund"><span>Rimborso atteso</span><b>' + h(d.nome) + ' deve riconoscere a ' + h(cr.nome) + '</b><strong class="num">' + eur(-d.totale) + '</strong></div>';
  }
  return '<div class="sec-h"><h2>Equilibrio spese</h2><span class="small muted">chi ha anticipato più della propria quota</span></div>' + msg
    + '<div class="tw"><table class="kv"><thead><tr><th></th>' + rows.map(r => '<th>' + h(r.nome) + '</th>').join('') + '</tr></thead><tbody>'
    + row('Speso nell\'anno', r => [eur(r.spesa)]) + row('Delta anno corrente', r => sgn(r.delta)) + row('Delta anni precedenti', r => sgn(r.deltaPrec)) + row('Totale', r => sgn(r.totale), 'sub') + '</tbody></table></div>'
    + '<p class="muted small" style="margin:0 4px 14px;max-width:62ch">Delta = speso − quota di competenza. Positivo: ha anticipato più della sua quota (a credito); negativo: a debito. Contano solo le categorie «da dividere tra noi», senza le spese personali della persona.</p>';
}

/* ------------------------------------------------------- form spesa (comune) */
const toCand = f => ({ data: f.data || null, categoria: (f.categoria || '').trim() || null, dettaglio: (f.dettaglio || '').trim() || null, spesa: C.round2(parseNum(f.spesa) || 0), pagato: f.pagato || null, vario: (f.vario || '').trim() || null });
function validate(f) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f.data || '')) return 'Inserisci la data';
  if (!f.categoria) return 'Scegli la categoria';
  const n = parseNum(f.spesa); if (!(n > 0)) return 'Inserisci un importo maggiore di zero';
  if (!f.pagato) return 'Indica chi ha pagato';
  return '';
}
function formFields(name, f) {
  const cats = S.categorie.map(c => c.nome).sort(byName); if (f.categoria && !cats.includes(f.categoria)) cats.push(f.categoria);
  const pers = S.persone.map(p => p.nome);
  const uniq = k => [...new Set(S.spese.concat(S.storico).map(e => e[k]).filter(Boolean))].sort(byName).slice(0, 400);
  return '<div class="form f" data-form="' + name + '">'
    + '<div class="row2"><div><label class="l" for="' + name + '_data">Data</label><input type="date" id="' + name + '_data" data-f="data" value="' + h(f.data) + '"></div>'
    + '<div><label class="l" for="' + name + '_spesa">Spesa (€)</label><input type="text" inputmode="decimal" id="' + name + '_spesa" data-f="spesa" class="amount" placeholder="0,00" autocomplete="off" value="' + h(f.spesa) + '"></div></div>'
    + '<div><label class="l" for="' + name + '_cat">Categoria</label><select id="' + name + '_cat" data-f="categoria"><option value="">Scegli…</option>' + cats.map(c => '<option ' + (c === f.categoria ? 'selected' : '') + '>' + h(c) + '</option>').join('') + '</select></div>'
    + '<div><span class="l" style="display:block;font-size:.84rem;font-weight:600;margin-bottom:5px;color:var(--ink2)">Pagato da</span><div class="seg" role="radiogroup" aria-label="Pagato da">'
    + pers.map(p => '<label><input type="radio" name="' + name + '_pag" data-f="pagato" value="' + h(p) + '" ' + (p === f.pagato ? 'checked' : '') + '><span>' + h(p) + '</span></label>').join('') + '</div></div>'
    + '<div><label class="l" for="' + name + '_det">Dettaglio</label><input type="text" id="' + name + '_det" data-f="dettaglio" list="dl-det" autocomplete="off" value="' + h(f.dettaglio) + '"></div>'
    + '<div><label class="l" for="' + name + '_var">Vario</label><input type="text" id="' + name + '_var" data-f="vario" list="dl-var" autocomplete="off" value="' + h(f.vario) + '"></div>'
    + '<div class="dup"></div>'
    + '<datalist id="dl-det">' + uniq('dettaglio').map(v => '<option value="' + h(v) + '">').join('') + '</datalist><datalist id="dl-var">' + uniq('vario').map(v => '<option value="' + h(v) + '">').join('') + '</datalist>'
    + '</div>';
}
function dupInfo(f, excludeId) {
  const c = toCand(f);
  if (!(c.categoria && c.spesa > 0 && c.pagato)) return { html: '', blocked: false };
  const d = C.checkDuplicati(S, c, excludeId);
  const tags = m => (m.mData ? '<span class="tag">stessa data</span>' : '') + (m.mDet && (m.e.dettaglio || c.dettaglio) ? '<span class="tag">stesso dettaglio</span>' : '') + (m.mVar && (m.e.vario || c.vario) ? '<span class="tag">stesso vario</span>' : '');
  const li = m => '<li><span class="num">' + fmtDate(m.e.data) + '</span> · ' + h(m.e.dettaglio || '—') + ' · ' + h(m.e.vario || '—') + tags(m) + '</li>';
  let html = '', blocked = false;
  if (d.strict.length) {
    blocked = !(C.DUP_OVERRIDE && f.override);
    html += '<div class="msg block"><b class="t">Spesa già presente (' + d.strict.length + ')</b>Stessa categoria, stesso importo e stesso pagante:<ul>' + d.strict.slice(0, 5).map(li).join('') + '</ul>'
      + (C.DUP_OVERRIDE ? '<label class="chk"><input type="checkbox" data-f="override" ' + (f.override ? 'checked' : '') + '><span>È una spesa diversa (es. ricorrente): voglio inserirla comunque</span></label>' : '') + '</div>';
  }
  if (d.soft.length) html += '<div class="msg warn"><b class="t">Controlla: stessa data, dettaglio e vario</b>Esiste già una spesa con gli stessi dati descrittivi, ma categoria, importo o pagante diversi:<ul>' + d.soft.slice(0, 5).map(li).join('') + '</ul></div>';
  return { html, blocked };
}
function updateDup(name, onlyButton) {
  const f = name === 'ins' ? ui.form : ui.edit; if (!f) return;
  const root = $('[data-form="' + name + '"]'); if (!root) return;
  const info = dupInfo(f, name === 'edit' ? f.id : null);
  if (!onlyButton) root.querySelector('.dup').innerHTML = info.html;
  const btn = $('[data-act="' + (name === 'ins' ? 'submitIns' : 'submitEdit') + '"]');
  if (btn) btn.disabled = info.blocked;
}
function rowHtml(e) {
  const flag = C.daGiustificare({ spese: [e] }).length;
  const dd = e.data ? fmtDate(e.data).slice(0, e.data.slice(0, 4) === String(S.anno) ? 5 : 10) : '—';
  return '<button class="lr ' + (flag ? 'flag' : '') + '" ' + (e.anno ? 'style="cursor:default"' : 'data-edit="' + e.id + '"') + '><span class="d num">' + dd + '</span><span class="c" style="--c:' + catColor(e.categoria) + '"><i></i>' + h(e.categoria || '(nessuna categoria)') + '<span class="pg">' + h(e.pagato || '') + '</span></span>'
    + '<span class="s">' + h([e.dettaglio, e.vario].filter(Boolean).join(' · ') || '—') + '</span><span class="p">' + h(e.pagato || '') + '</span><span class="a num">' + eur(e.spesa) + '</span></button>';
}

/* ----------------------------------------------------------------- Confronta */
const YCOL = ['#6a4cff', '#e8590c', '#1c9a6c', '#d6336c', '#1c7ed6', '#a37b00', '#7048e8', '#37b24d'];
const cmpYears = () => [...new Set(S.storico.map(e => e.anno).filter(Boolean).concat(S.anno))].sort((a, b) => a - b);
const cmpCats = () => S.categorie.filter(c => S.spese.concat(S.storico).some(e => norm(e.categoria) === norm(c.nome))).sort((a, b) => byName(a.nome, b.nome));
function cmpState() {
  if (!ui.cmp) ui.cmp = { anni: cmpYears().filter(y => y === S.anno || y === S.anno - 1), cats: cmpCats().filter(c => isIncluded(c)).map(c => c.nome) };
  return ui.cmp;
}
function cmpMonthly(y, pred) {
  const v = Array(12).fill(0), src = y === S.anno ? S.spese : S.storico.filter(e => e.anno === y);
  for (const e of src) if (e.data && +e.data.slice(0, 4) === y && pred(e)) v[+e.data.slice(5, 7) - 1] += e.spesa;
  return v;
}
function lineChart(series) {
  const W = 600, H = 230, pl = 46, pr = 12, pt = 14, pb = 28;
  const all = series.flatMap(x => x.vals.filter(v => v != null)), top = Math.max(...all, 1);
  const X = i => pl + (W - pl - pr) * i / 11, Y = v => pt + (H - pt - pb) * (1 - v / top);
  let g = '<svg class="col" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Confronto per mese">';
  for (let k = 0; k <= 4; k++) {
    const v = top * k / 4, yy = Y(v);
    g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="var(--line)"/><text x="' + (pl - 6) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end">' + Math.round(v).toLocaleString('it-IT') + '</text>';
  }
  MESI.forEach((m, i) => { g += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + m + '</text>'; });
  for (const x of series) {
    let d = '', pen = false;
    x.vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; });
    g += '<path d="' + d + '" fill="none" stroke="' + x.color + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    x.vals.forEach((v, i) => { if (v != null) g += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="3.2" fill="' + x.color + '"><title>' + h(x.label) + ' · ' + MESI_LUNGHI[i] + ': ' + eur(v) + '</title></circle>'; });
  }
  return g + '</svg>';
}
function cmpChart(anni, pred) {
  const now = new Date(), cm = now.getMonth() + 1, all = cmpYears();
  const series = anni.map(y => {
    const vals = cmpMonthly(y, pred), tot = vals.reduce((a, b) => a + b, 0);
    return { label: String(y), color: YCOL[all.indexOf(y) % YCOL.length], tot, vals: y === now.getFullYear() ? vals.map((v, i) => i < cm ? v : null) : vals };
  });
  return lineChart(series) + '<div class="leg w2" style="margin-top:10px">' + series.map(x => '<div style="--c:' + x.color + '"><i></i><span>' + x.label + '</span><span class="a num">' + eur(x.tot) + '</span></div>').join('') + '</div>';
}
function pageConfronta() {
  const c = cmpState(), yrs = cmpYears(), cats = cmpCats();
  const chip = (on, act, attr, label, col) => '<button class="chip ' + (on ? 'on' : '') + '" data-act="' + act + '" ' + attr + ' style="--c:' + col + '" aria-pressed="' + on + '"><i></i>' + h(label) + '</button>';
  let o = '<h1 class="ttl">Confronta</h1>'
    + '<div class="card"><div class="card-h"><h3>Anni</h3><span class="muted small">scegli uno o più anni</span></div><div class="chips">'
    + yrs.map(y => chip(c.anni.includes(y), 'cmpAnno', 'data-y="' + y + '"', y, YCOL[yrs.indexOf(y) % YCOL.length])).join('') + '</div></div>'
    + '<div class="card"><div class="card-h"><h3>Categorie</h3><span class="muted small"><button class="pill-btn" data-act="cmpAll">Tutte</button> <button class="pill-btn" data-act="cmpNone">Nessuna</button></span></div><div class="chips">'
    + cats.map(k => chip(c.cats.includes(k.nome), 'cmpCat', 'data-c="' + h(k.nome) + '"', k.nome, k.colore)).join('') + '</div></div>';
  const anni = c.anni.slice().sort((a, b) => a - b), sel = cats.filter(k => c.cats.includes(k.nome));
  if (!anni.length || !sel.length) return o + '<div class="card empty">Scegli almeno un anno e una categoria da confrontare.</div>';
  const names = new Set(sel.map(k => norm(k.nome)));
  if (sel.length === 1) return o + '<div class="sec-h"><h2>' + h(sel[0].nome) + '</h2><span class="small muted">spesa per mese</span></div><div class="card">' + cmpChart(anni, e => names.has(norm(e.categoria))) + '</div>';
  const slides = sel.map(k => [k.nome, cmpChart(anni, e => norm(e.categoria) === norm(k.nome))]);
  return o + '<div class="sec-h"><h2>Somma delle categorie</h2><span class="small muted">' + sel.length + ' categorie · spesa per mese</span></div><div class="card">' + cmpChart(anni, e => names.has(norm(e.categoria))) + '</div>'
    + '<div class="sec-h"><h2>Confronto per categoria</h2><span class="small muted">scorri per vedere le singole categorie</span></div><div class="card"><div class="slides">'
    + slides.map(x => sl(h(x[0]), x[1])).join('') + '</div>' + dots(slides.map(x => x[0])) + '</div>';
}

/* ----------------------------------------------------------------- Inserisci */
function pageInserisci() {
  const last = S.spese.slice(-5).reverse();
  return '<h1 class="ttl">Nuova spesa</h1><div class="card">' + formFields('ins', ui.form)
    + '<div class="acts" style="margin-top:16px"><button class="btn grow" data-act="submitIns" style="min-height:52px">Aggiungi spesa</button></div></div>'
    + (last.length ? '<div class="sec-h"><h3>Ultime inserite</h3><button class="pill-btn" data-go="dettaglio">Vedi tutte</button></div><div class="led">' + last.map(rowHtml).join('') + '</div>' : '');
}
function submitIns() {
  const f = ui.form, err = validate(f); if (err) return toast(err);
  const c = toCand(f), d = C.checkDuplicati(S, c, null);
  if (d.strict.length && !(C.DUP_OVERRIDE && f.override)) return toast('Spesa già presente: controlla il messaggio');

/* ------------------------------------------------------------------ Dettaglio */
function pageDettaglio() {
  const cats = S.categorie.map(c => c.nome).filter(n => !/^riassunto\b/i.test(n)).sort(byName), f = ui.fil, yr = selYear();
  const years = [...new Set(S.storico.map(e => e.anno).filter(Boolean).concat(S.anno))].sort((a, b) => b - a);
  const opt = (v, l, sel) => '<option value="' + h(v) + '" ' + (sel ? 'selected' : '') + '>' + h(l) + '</option>';
  return '<h1 class="ttl">Spese ' + yr + '</h1>'

    + '<div><label for="f_cat">Categoria</label><select class="in" id="f_cat" data-fil="cat">' + opt('', 'Tutte', !f.cat) + opt('__none', '(senza categoria)', f.cat === '__none') + cats.map(c => opt(c, c, c === f.cat)).join('') + '</select></div>'
    + '<div><label for="f_mese">Mese</label><select class="in" id="f_mese" data-fil="mese">' + opt('', 'Tutti', !f.mese) + MESI_LUNGHI.map((m, i) => opt(i + 1, m, String(i + 1) === String(f.mese))).join('') + '</select></div>'
    + '<div><label for="f_pag">Pagato da</label><select class="in" id="f_pag" data-fil="pagato">' + opt('', 'Tutti', !f.pagato) + S.persone.map(p => opt(p.nome, p.nome, p.nome === f.pagato)).join('') + '</select></div>'
    + '<div><label for="f_min">Importo da</label><input class="in" id="f_min" data-fil="min" type="text" inputmode="decimal" placeholder="min" value="' + h(f.min) + '"></div>'
    + '<div><label for="f_max">Importo a</label><input class="in" id="f_max" data-fil="max" type="text" inputmode="decimal" placeholder="max" value="' + h(f.max) + '"></div>'
    + '<div><button class="btn sec sm" data-act="resetFil" style="width:100%">Azzera filtri</button></div></div>'
    + '<div id="listwrap"></div>';
}
function selYear() { const y = +ui.fil.anno; return y && y !== S.anno ? y : S.anno; }
function filtered() {
  const f = ui.fil, min = parseNum(f.min), max = parseNum(f.max), yr = selYear();
  const src = yr === S.anno ? S.spese : S.storico.filter(e => e.anno === yr);
  return src.map((e, i) => ({ e, i })).filter(({ e }) => {
    if (f.cat === '__none') { if (e.categoria) return false; } else if (f.cat && norm(e.categoria) !== norm(f.cat)) return false;
    if (f.mese && (!e.data || +e.data.slice(5, 7) !== +f.mese || +e.data.slice(0, 4) !== yr)) return false;
    if (f.pagato && norm(e.pagato) !== norm(f.pagato)) return false;
    if (min != null && e.spesa < min) return false;
    if (max != null && e.spesa > max) return false;
    return true;
  }).sort((a, b) => (b.e.data || '').localeCompare(a.e.data || '') || b.i - a.i).map(x => x.e);
}
function renderList() {
  const w = $('#listwrap'); if (!w) return;
  const list = filtered(), tot = list.reduce((s, e) => s + e.spesa, 0), shown = list.slice(0, ui.limit);
  w.innerHTML = '<div class="sum"><b>' + list.length + (list.length === 1 ? ' spesa' : ' spese') + '</b><span class="num">Totale <b>' + eur(tot) + '</b></span>' + (list.length ? '<span class="muted small">' + (selYear() === S.anno ? 'Tocca una riga per modificarla' : 'Anno archiviato: sola lettura') + '</span>' : '') + '</div>'
    + (list.length ? '<div class="led">' + shown.map(rowHtml).join('') + '</div>' + (list.length > shown.length ? '<div class="acts" style="justify-content:center;margin-top:12px"><button class="btn sec" data-act="more">Mostra altre ' + Math.min(200, list.length - shown.length) + '</button></div>' : '') : '<div class="led empty">Nessuna spesa con questi filtri.</div>');
}

/* ----------------------------------------------------------- modifica spesa */
function openEdit(id) {
  const e = S.spese.find(x => x.id === +id); if (!e) return;
  ui.edit = { id: e.id, data: e.data || '', categoria: e.categoria || '', dettaglio: e.dettaglio || '', spesa: inum(e.spesa), pagato: e.pagato || '', vario: e.vario || '', override: false };
  const html = '<div class="sec-h" style="margin-top:0"><h2>Modifica spesa</h2></div>' + formFields('edit', ui.edit)
    + '<div class="acts" style="margin-top:16px"><button class="btn grow" data-act="submitEdit">Salva modifiche</button><button class="btn danger" data-act="delEdit">Elimina</button><button class="btn sec" data-act="closeModal">Annulla</button></div>';
  openModal(html); updateDup('edit');
}
function submitEdit() {
  const f = ui.edit, err = validate(f); if (err) return toast(err);
  const c = toCand(f), d = C.checkDuplicati(S, c, f.id);
  if (d.strict.length && !(C.DUP_OVERRIDE && f.override)) return toast('Esiste già una spesa identica: spunta la conferma per salvare');

}
function delEdit() {
  const f = ui.edit; if (!f || !confirm('Eliminare questa spesa?')) return;

}

  }

  o += '<div class="sec-h"><h2>Categorie</h2></div><div class="card"><p class="help">'
    + '<span><b>Nel budget casa</b> — la categoria conta per calcolare quanto costa la casa in un anno (affitto, bollette, spesa…). Da questo totale nascono le quote mensili di ognuno.</span>'
    + '<span><b>Da dividere tra noi</b> — se la paga di tasca sua uno di voi due, la spesa entra in «Equilibrio spese»: chi anticipa più della propria quota va a credito. Spegnila per ciò che non va diviso (es. autostrada, benzina, tasse).</span>'
    + '<span><b>Spesa personale di</b> — è la spesa di una sola persona (es. Spese Simo). Nel Riassunto è esclusa di default dai totali e dalle medie della famiglia; puoi rimetterla con i filtri.</span></p></div>'
    + '<div class="led">'
    + S.categorie.map((c, i) => {
      const used = S.spese.concat(S.storico).some(e => norm(e.categoria) === norm(c.nome));
      return '<div class="cat-row"><input type="color" data-set="catColor" data-i="' + i + '" value="' + h(c.colore.toLowerCase()) + '" aria-label="Colore di ' + h(c.nome) + '"><input class="in" data-set="catName" data-i="' + i + '" value="' + h(c.nome) + '" aria-label="Nome categoria">'
        + '<button class="pill-btn" data-act="delCat" data-i="' + i + '" ' + (used ? 'disabled title="Categoria in uso"' : '') + ' aria-label="Elimina ' + h(c.nome) + '">Elimina</button>'
        + '<div class="cat-opts"><label><input type="checkbox" data-set="catBase" data-i="' + i + '" ' + (c.base ? 'checked' : '') + '>Nel budget casa</label><label><input type="checkbox" data-set="catRip" data-i="' + i + '" ' + (c.riparto ? 'checked' : '') + '>Da dividere tra noi</label>'
        + '<label>Spesa personale di <select data-set="catPers" data-i="' + i + '"><option value="">nessuno</option>' + S.persone.map(p => '<option ' + (norm(p.nome) === norm(c.personaleDi) ? 'selected' : '') + '>' + h(p.nome) + '</option>').join('') + '</select></label></div></div>';
    }).join('')
    + '<div class="cat-row" style="grid-template-columns:1fr auto"><input class="in" id="newCat" placeholder="Nuova categoria" aria-label="Nuova categoria"><button class="btn sm" data-act="addCat">Aggiungi</button></div></div>';

  o += '<div class="sec-h"><h2>Persone</h2></div><div class="led">'
    + S.persone.map((p, i) => {
      const used = S.spese.concat(S.storico).some(e => norm(e.pagato) === norm(p.nome));
      return '<div class="cat-row" style="grid-template-columns:1fr auto"><input class="in" data-set="perName" data-i="' + i + '" value="' + h(p.nome) + '" aria-label="Nome">'
        + '<button class="pill-btn" data-act="delPer" data-i="' + i + '" ' + (used ? 'disabled title="In uso nelle spese"' : '') + '>Elimina</button>'
        + '<div class="cat-opts"><label><input type="checkbox" data-set="perRip" data-i="' + i + '" ' + (p.riparto ? 'checked' : '') + '>Partecipa ai conti tra noi</label><span class="small">ha stipendio e quota ed entra nell\'Equilibrio spese. Lascialo spento per il conto comune.</span></div></div>';
    }).join('')
    + '<div class="cat-row" style="grid-template-columns:1fr auto"><input class="in" id="newPer" placeholder="Nuova persona o conto" aria-label="Nuova persona"><button class="btn sm" data-act="addPer">Aggiungi</button></div></div>';

  const ended = S.anno < now.getFullYear();
  o += '<div class="sec-h"><h2>Chiusura anno</h2></div><div class="card"><p style="margin:0 0 14px">Sposta le ' + S.spese.length + ' spese del ' + S.anno + ' nello storico e apre il ' + (S.anno + 1) + '. Riassunto ed equilibrio si ricalcolano da soli.'
    + (ended ? '' : ' <b>L\'anno non è ancora concluso.</b>') + '</p><button class="btn ' + (ended ? '' : 'sec') + '" data-act="archiveAsk"' + (S.spese.length ? '' : ' disabled') + '>Archivia ' + S.anno + '…</button></div>';

  o += '<div class="sec-h"><h2>Profilo su questo dispositivo</h2></div><div class="card"><p class="small muted" style="margin:0">Il file è unico. Il profilo (Simone o Laura) è una scelta per dispositivo: con il profilo Laura questa pagina resta nascosta. Si cambia toccando il nome in alto.</p></div>';
  return o;
}
function setSetting(el) {
  const k = el.dataset.set, n = el.dataset.n, i = +el.dataset.i, p = n && S.persone.find(x => x.nome === n);
  switch (k) {
    case 'stipendio': p.stipendio = parseNum(el.value); break;
    case 'depositati': p.depositati = parseNum(el.value); p.ultAgg = C.todayIso(); break;
    case 'ultAgg': p.ultAgg = el.value || null; break;
    case 'catName': {
      const nn = el.value.trim(), old = S.categorie[i].nome;
      if (!nn || nn === old) { renderMain(); return; }
      if (S.categorie.some((c, j) => j !== i && norm(c.nome) === norm(nn))) { toast('Esiste già una categoria con questo nome'); renderMain(); return; }
      S.spese.concat(S.storico).forEach(e => { if (norm(e.categoria) === norm(old)) e.categoria = nn; }); S.categorie[i].nome = nn; break;
    }
    case 'catColor': S.categorie[i].colore = el.value.toUpperCase(); break;
    case 'catBase': S.categorie[i].base = el.checked; break;
    case 'catRip': S.categorie[i].riparto = el.checked; break;
    case 'catPers': S.categorie[i].personaleDi = el.value || null; break;
    case 'perRip': S.persone[i].riparto = el.checked; break;
    case 'perName': {
      const nn = el.value.trim(), old = S.persone[i].nome;
      if (!nn || nn === old) { renderMain(); return; }
      if (S.persone.some((q, j) => j !== i && norm(q.nome) === norm(nn))) { toast('Nome già presente'); renderMain(); return; }
      S.spese.concat(S.storico).forEach(e => { if (norm(e.pagato) === norm(old)) e.pagato = nn; });
      S.pesi.forEach(w => { if (norm(w.persona) === norm(old)) w.persona = nn; });
      S.categorie.forEach(c => { if (norm(c.personaleDi) === norm(old)) c.personaleDi = nn; });
      if (lsGet('lastPagato') === old) lsSet('lastPagato', nn);
      S.persone[i].nome = nn; break;
    }
    default: return;
  }
  commit();
}
function savePesi() {
  const a = ui.editPesi, rip = S.persone.filter(q => q.riparto), vals = {};
  $$('input[data-pa]').forEach(inp => { vals[inp.dataset.pa] = parseNum(inp.value); });
  const filled = rip.filter(q => vals[q.nome] != null);
  if (filled.length === rip.length && Math.abs(filled.reduce((s, q) => s + vals[q.nome], 0) - 100) > 0.15) return toast('I pesi devono sommare 100%');
  rip.forEach(q => {
    const idx = S.pesi.findIndex(x => x.anno === a && norm(x.persona) === norm(q.nome)), v = vals[q.nome];
    if (v == null) { if (idx >= 0) S.pesi.splice(idx, 1); } else if (idx >= 0) S.pesi[idx].peso = v / 100; else S.pesi.push({ anno: a, persona: q.nome, peso: v / 100 });
  });
  ui.editPesi = null; commit('Pesi del ' + a + ' aggiornati');
}
function archiveAsk() {
  const tot = S.spese.reduce((s, e) => s + e.spesa, 0);
  openModal('<div class="sec-h" style="margin-top:0"><h2>Archivia ' + S.anno + '</h2></div><p style="margin:0 0 10px"><b>' + S.spese.length + ' spese</b> per <b class="num">' + eur(tot) + '</b> passeranno nello storico. Poi l\'anno corrente diventa il <b>' + (S.anno + 1) + '</b> e l\'elenco spese riparte vuoto.</p>'
    + '<label class="chk"><input type="checkbox" id="azzera" checked><span>Azzera «Depositati» di ogni persona (nuovo anno, nuovo conteggio)</span></label>'
    + '<p class="small muted">Prima dell\'archiviazione i pesi dell\'anno vengono fissati negli anni precedenti. Puoi annullare chiudendo il file senza salvare.</p>'
    + '<div class="acts"><button class="btn grow" data-act="archiveDo">Archivia e passa al ' + (S.anno + 1) + '</button><button class="btn sec" data-act="closeModal">Annulla</button></div>');
}
function archiveDo() {
  const az = $('#azzera') ? $('#azzera').checked : false, y = S.anno;
  const n = C.archivia(S, { azzeraDepositati: az }); closeModal(); ui.form = newForm(); ui.page = 'riassunto';
  commit('Archiviate ' + n + ' spese del ' + y + '. Ora sei nel ' + S.anno);
}

/* ------------------------------------------------------------------ eventi */
document.addEventListener('click', e => {
  if (busyN) return;
  const t = e.target.closest('[data-go],[data-act],[data-edit]'); if (!t) { if (e.target.id === 'scrim') closeModal(); return; }
  if (t.dataset.go) { ui.page = t.dataset.go; renderTop(); renderMain(); return; }
  if (t.dataset.edit) { openEdit(t.dataset.edit); return; }
  const i = +t.dataset.i;
  switch (t.dataset.act) {
    case 'save': save(false); break;
    case 'changeFile': if (!ui.dirty || (autoMode() && !ui.saveErr && !ui.conflict) || confirm('Ci sono modifiche non salvate nel file. Cambiare file comunque? (restano nella copia locale)')) { S = null; renderAll(); init(true); } break;
    case 'gsOpen': remoteLoad(); break;
    case 'gsSetup': gsSetup(); break;
    case 'gsSave': gsSave(); break;
    case 'gsReload': closeModal(); ui.dirty = false; ui.conflict = false; remoteLoad(); break;
    case 'gsForce': closeModal(); ui.conflict = false; remoteSave(false, true); break;
    case 'openFile': openPicker(); break;
    case 'reopenHandle': reopenHandle(); break;
    case 'resumeLocal': resumeLocal(); break;
    case 'submitIns': submitIns(); break;
    case 'submitEdit': submitEdit(); break;
    case 'delEdit': delEdit(); break;
    case 'closeModal': closeModal(); break;
    case 'resetFil': ui.fil = { anno: '', cat: '', mese: '', pagato: '', min: '', max: '' }; ui.limit = 200; renderMain(); break;
    case 'more': ui.limit += 200; renderList(); break;
    case 'slide': { const sl = t.closest('.card').querySelector('.slides'); sl.scrollTo({ left: sl.clientWidth * +t.dataset.n, behavior: 'smooth' }); break; }
    case 'cmpAnno': { const c = cmpState(), y = +t.dataset.y; c.anni = c.anni.includes(y) ? c.anni.filter(x => x !== y) : c.anni.concat(y); renderMain(); break; }
    case 'cmpCat': { const c = cmpState(), n = t.dataset.c; c.cats = c.cats.includes(n) ? c.cats.filter(x => x !== n) : c.cats.concat(n); renderMain(); break; }
    case 'cmpAll': cmpState().cats = cmpCats().map(k => k.nome); renderMain(); break;
    case 'cmpNone': cmpState().cats = []; renderMain(); break;
    case 'toggleCat': { const m = catOnMap(), c = S.categorie.find(x => x.nome === t.dataset.c); m[c.nome] = !isIncluded(c); lsSet('catOn', JSON.stringify(m)); renderMain(); break; }
    case 'editPesi': ui.editPesi = +t.dataset.a; renderMain(); break;
    case 'cancelPesi': ui.editPesi = null; renderMain(); break;
    case 'savePesi': savePesi(); break;
    case 'addCat': { const v = ($('#newCat').value || '').trim(); if (!v) break; if (S.categorie.some(c => norm(c.nome) === norm(v))) { toast('Categoria già presente'); break; } S.categorie.push({ nome: v, base: false, riparto: true, personaleDi: null, colore: C.defaultColor(v) }); commit('Categoria aggiunta'); break; }
    case 'delCat': S.categorie.splice(i, 1); commit('Categoria eliminata'); break;
    case 'addPer': { const v = ($('#newPer').value || '').trim(); if (!v) break; if (S.persone.some(p => norm(p.nome) === norm(v))) { toast('Nome già presente'); break; } S.persone.push({ nome: v, stipendio: null, depositati: null, ultAgg: null, riparto: false }); commit('Aggiunto: ' + v); break; }
    case 'delPer': S.persone.splice(i, 1); commit('Eliminato'); break;
    case 'archiveAsk': archiveAsk(); break;
    case 'archiveDo': archiveDo(); break;
    case 'askProfile': askProfile(); break;
    case 'setProfile': setProfile(t.dataset.p); break;
  }
});
function onFormInput(e) {
  const el = e.target;
  if (el.dataset.f) {
    const root = el.closest('[data-form]'); if (!root) return;
    const name = root.dataset.form, f = name === 'ins' ? ui.form : ui.edit; if (!f) return;
    if (el.dataset.f === 'override') { f.override = el.checked; updateDup(name, true); return; }
    f[el.dataset.f] = el.value; f.override = false; updateDup(name);
  } else if (el.dataset.fil) {
    ui.fil[el.dataset.fil] = el.value; ui.limit = 200; if (el.dataset.fil === 'anno') renderMain(); else renderList();
  }
}
document.addEventListener('input', onFormInput);
document.addEventListener('scroll', ev => {
  const sl = ev.target; if (!sl.classList || !sl.classList.contains('slides')) return;
  const i = Math.round(sl.scrollLeft / sl.clientWidth);
  sl.closest('.card').querySelectorAll('.dot').forEach((d, k) => d.classList.toggle('on', k === i));
}, true);
document.addEventListener('change', e => {
  if (e.target.dataset.set) { setSetting(e.target); return; }
  if (e.target.matches('select[data-f],input[type=radio][data-f],input[type=date][data-f]')) onFormInput(e);
  if (e.target.id === 'fileInput') { const f = e.target.files[0]; e.target.value = ''; if (f) f.arrayBuffer().then(b => loadBuffer(b, f.name, null, false)); }
});
document.addEventListener('keydown', e => {
  if (busyN) { e.preventDefault(); return; }
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.matches('[data-f]') && e.target.type !== 'checkbox' && e.target.tagName !== 'SELECT') {
    const root = e.target.closest('[data-form]'); if (!root) return; e.preventDefault();
    if (root.dataset.form === 'ins') submitIns(); else submitEdit();
  }
});
window.addEventListener('beforeunload', e => { if (S && ui.dirty && !(autoMode() && !ui.saveErr && !ui.conflict && !saving)) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') remoteRefresh(); });

/* --------------------------------------------------------------------- avvio */
function injectPWA() {
  try {
    const icon = window.__ICON__; if (!icon) return;
    const m = { name: 'Conti di casa', short_name: 'Conti', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#f4f6fb', theme_color: '#1b3fa0', icons: [{ src: icon, sizes: '512x512', type: 'image/png', purpose: 'any' }] };
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' })); document.head.appendChild(l);
  } catch (e) { /* ignore */ }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
async function init(skipAuto) {
  let last = null, handle = null;
  try { last = await kvGet('last'); handle = await kvGet('handle'); } catch (e) { /* ignore */ }
  ui.landing = { last, handle }; if (!S) renderAll();
  if (!S && !skipAuto && gsCfg().url) await remoteLoad();
}
injectPWA(); init();
window.__app = { ui, get S() { return S; }, C, loadBuffer };
})();
</script>
